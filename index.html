<body>
<main>
<header><h1>性癖ビンゴゲーム</h1><p class="hint">マスをタップして印を付けましょう</p></header>
<div class="controls"><button class="control primary" id="check" type="button">ビンゴを確認</button><button class="control" id="complete" type="button">完了して画像を保存</button><button class="control" id="reset" type="button">リセット</button></div>
<p class="status" id="status" aria-live="polite">0 マスに印が付いています</p>
<div class="board" role="group" aria-label="5行5列のビンゴカード"><div class="tiles" id="tiles"></div></div>
<p class="legend">マスをクリックして印を付けたり外したりできます。</p>
</main>
<script>
const tiles=document.getElementById('tiles'),status=document.getElementById('status');
for(let i=0;i<25;i++){const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',`${Math.floor(i/5)+1}行${i%5+1}列`);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{b.classList.toggle('marked');b.setAttribute('aria-pressed',b.classList.contains('marked'));updateCount()});tiles.appendChild(b)}
function updateCount(){status.textContent=`${document.querySelectorAll('.tile.marked').length} マスに印が付いています`}
document.getElementById('check').addEventListener('click',()=>{const a=[...tiles.children],lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));lines.push([0,1,2,3,4].map(i=>i*5+i),[0,1,2,3,4].map(i=>i*5+4-i));const wins=lines.filter(line=>line.every(i=>a[i].classList.contains('marked'))).length;status.textContent=wins?`ビンゴ！ ${wins} 列そろいました 🎉`:'まだビンゴはありません。もう少しです！'});
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('.tile').forEach(b=>{b.classList.remove('marked');b.setAttribute('aria-pressed','false')});updateCount()});
